file_format: definition/2

# Kafka spans, one per operation type. Each extends the base messaging
# attributes (`messaging.attributes`) with Kafka-specific attributes.
attribute_groups:
  # Kafka-specific attributes that apply to both producer and consumer spans and
  # are not present in `messaging.attributes` (a group cannot re-declare a base
  # attribute). Consumer-only Kafka attributes (`messaging.kafka.offset`) and
  # brief/level overrides of base attributes are applied directly on each span.
  - id: messaging.kafka.attributes
    visibility: internal
    attributes:
      - ref: messaging.kafka.message.key
        requirement_level:
          recommended: If span describes operation on a single message.
      - ref: messaging.kafka.message.tombstone
        requirement_level:
          conditionally_required: If value is `true`. When missing, the value is assumed to be `false`.

spans:
  # Producer spans do not carry consumer-side attributes
  # (`messaging.consumer.group.name`, `messaging.kafka.offset`).
  - type: messaging.kafka.send.producer
    kind: producer
    stability: development
    brief: Describes an Apache Kafka `send` operation.
    name:
      note: &kafka-span-name >
        Kafka span names SHOULD follow the general
        [span naming guidance](/docs/messaging/messaging-spans.md#span-name):
        `{messaging.operation.name} {destination}`.
    attributes: &kafka-producer-attributes
      - ref_group: messaging.attributes
      - ref_group: messaging.kafka.attributes
      - ref: messaging.destination.partition.id
        brief: >
          String representation of the partition id the message (or batch) is sent to or received from.
        requirement_level: recommended
        sampling_relevant: true
      - ref: messaging.message.body.size
        requirement_level: opt_in
        brief: The size of the message body in bytes. Only applicable for spans describing single message operations.

  # Consumer spans add consumer-side attributes on top of the producer set.
  - type: messaging.kafka.receive.client
    kind: client
    stability: development
    brief: Describes an Apache Kafka `receive` operation.
    name:
      note: *kafka-span-name
    attributes: &kafka-consumer-attributes
      - ref_group: messaging.attributes
      - ref_group: messaging.kafka.attributes
      - ref: messaging.destination.partition.id
        brief: >
          String representation of the partition id the message (or batch) is sent to or received from.
        requirement_level: recommended
        sampling_relevant: true
      - ref: messaging.message.body.size
        requirement_level: opt_in
        brief: The size of the message body in bytes. Only applicable for spans describing single message operations.
      - ref: messaging.consumer.group.name
        brief: "Kafka [consumer group id](https://docs.confluent.io/platform/current/clients/consumer.html)."
        note: ""
        sampling_relevant: true
      - ref: messaging.kafka.offset
        requirement_level:
          recommended: If span describes operation on a single message.

  - type: messaging.kafka.process.consumer
    kind: consumer
    stability: development
    brief: Describes an Apache Kafka `process` operation.
    name:
      note: *kafka-span-name
    attributes: *kafka-consumer-attributes

  - type: messaging.kafka.settle.client
    kind: client
    stability: development
    brief: Describes an Apache Kafka `settle` operation.
    name:
      note: *kafka-span-name
    attributes: *kafka-consumer-attributes
