file_format: definition/2

# Azure Service Bus and Azure Event Hubs spans, one per operation type. Each
# extends the base messaging attributes (`messaging.attributes`) with
# system-specific attributes. Overrides of base attributes and consumer-only
# attributes are applied directly on each span. No system-specific NEW attribute
# groups are required: all Azure messaging attributes are already declared in the
# registry and either belong to `messaging.attributes` (overridden directly on
# the spans) or are referenced directly per span.
spans:
  # ---------------------------------------------------------------------------
  # Azure Service Bus
  # ---------------------------------------------------------------------------
  - type: messaging.servicebus.send.producer
    kind: producer
    stability: development
    brief: Describes an Azure Service Bus `send` operation.
    name:
      note: &span-name >
        Span names SHOULD follow the general
        [span naming guidance](/docs/messaging/messaging-spans.md#span-name):
        `{messaging.operation.name} {destination}`.
    attributes:
      - ref_group: messaging.attributes
      - &sb-operation-name
        ref: messaging.operation.name
        brief: Azure Service Bus operation name.
        note: |
          The operation name SHOULD match one of the following values:

          - sender operations: `send`, `schedule`, `cancel_scheduled`
          - transaction operations: `create_transaction`, `commit_transaction`, `rollback_transaction`
          - receiver operation: `receive`, `peek`, `receive_deferred`, `renew_message_lock`
          - settlement operations: `abandon`, `complete`, `defer`, `dead_letter`, `delete`
          - session operations: `accept_session`, `get_session_state`, `set_session_state`, `renew_session_lock`

          If none of the above operation names apply, the attribute SHOULD be set
          to the name of the client method in snake_case.
        examples: ['send', 'receive', 'complete', 'process', 'peek']
      - &sb-conversation-id
        ref: messaging.message.conversation_id
        brief: Message [correlation Id](https://learn.microsoft.com/azure/service-bus-messaging/service-bus-messages-payloads#message-routing-and-correlation) property.

  - type: messaging.servicebus.receive.client
    kind: client
    stability: development
    brief: Describes an Azure Service Bus `receive` operation.
    name:
      note: *span-name
    attributes: &sb-consumer-attributes
      - ref_group: messaging.attributes
      - *sb-operation-name
      - *sb-conversation-id
      - &sb-subscription-name
        ref: messaging.destination.subscription.name
        brief: "Azure Service Bus [subscription name](https://learn.microsoft.com/azure/service-bus-messaging/service-bus-queues-topics-subscriptions#topics-and-subscriptions)."
        note: ""
        sampling_relevant: true
        requirement_level:
          conditionally_required: If messages are received from the subscription.
      - &sb-delivery-count
        ref: messaging.servicebus.message.delivery_count
        requirement_level:
          conditionally_required: If delivery count is available and is bigger than 0.
      - &sb-enqueued-time
        ref: messaging.servicebus.message.enqueued_time

  - type: messaging.servicebus.process.consumer
    kind: consumer
    stability: development
    brief: Describes an Azure Service Bus `process` operation.
    name:
      note: *span-name
    attributes: *sb-consumer-attributes

  - type: messaging.servicebus.settle.client
    kind: client
    stability: development
    brief: Describes an Azure Service Bus `settle` operation.
    name:
      note: *span-name
    attributes:
      - ref_group: messaging.attributes
      - *sb-operation-name
      - *sb-conversation-id
      - *sb-subscription-name
      - *sb-delivery-count
      - *sb-enqueued-time
      - ref: messaging.servicebus.disposition_status
        requirement_level:
          conditionally_required: if and only if `messaging.operation` is `settle`.

  # ---------------------------------------------------------------------------
  # Azure Event Hubs
  # ---------------------------------------------------------------------------
  - type: messaging.eventhubs.send.producer
    kind: producer
    stability: development
    brief: Describes an Azure Event Hubs `send` operation.
    name:
      note: *span-name
    attributes:
      - ref_group: messaging.attributes
      - &eh-operation-name
        ref: messaging.operation.name
        brief: Azure Event Hubs operation name.
        examples: ['send', 'receive', 'checkpoint']
        note: |
          The operation name SHOULD match one of the following values:

          - `send`
          - `receive`
          - `process`
          - `checkpoint`
          - `get_partition_properties`
          - `get_event_hub_properties`

          If none of the above operation names apply, the attribute SHOULD be set
          to the name of the client method in snake_case.
      - &eh-partition-id
        ref: messaging.destination.partition.id
        brief: >
          String representation of the partition id messages are sent to or received from, unique within the Event Hub.
        requirement_level:
          conditionally_required: If available.
        sampling_relevant: true

  - type: messaging.eventhubs.receive.client
    kind: client
    stability: development
    brief: Describes an Azure Event Hubs `receive` operation.
    name:
      note: *span-name
    attributes: &eh-consumer-attributes
      - ref_group: messaging.attributes
      - *eh-operation-name
      - *eh-partition-id
      - &eh-consumer-group-name
        ref: messaging.consumer.group.name
        brief: "Azure Event Hubs [consumer group name](https://learn.microsoft.com/azure/event-hubs/event-hubs-features#consumer-groups)."
        note: ""
        requirement_level:
          conditionally_required: On consumer spans.
        sampling_relevant: true
      - &eh-enqueued-time
        ref: messaging.eventhubs.message.enqueued_time

  - type: messaging.eventhubs.process.consumer
    kind: consumer
    stability: development
    brief: Describes an Azure Event Hubs `process` operation.
    name:
      note: *span-name
    attributes: *eh-consumer-attributes

  - type: messaging.eventhubs.settle.client
    kind: client
    stability: development
    brief: Describes an Azure Event Hubs `settle` operation.
    name:
      note: *span-name
    attributes: *eh-consumer-attributes
