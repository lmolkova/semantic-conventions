file_format: definition/2

# RabbitMQ spans, one per operation type. Each extends the base messaging
# attributes (`messaging.attributes`) with RabbitMQ-specific attributes.
attribute_groups:
  # RabbitMQ-specific attributes that apply to both producer and consumer spans
  # and are not present in `messaging.attributes` (a group cannot re-declare a
  # base attribute). Consumer-only RabbitMQ attributes
  # (`messaging.rabbitmq.message.delivery_tag`) and brief/level overrides of base
  # attributes are applied directly on each span.
  - id: messaging.rabbitmq.attributes
    visibility: internal
    attributes:
      - ref: messaging.rabbitmq.destination.routing_key
        requirement_level:
          conditionally_required: If not empty.

spans:
  # Producer spans do not carry consumer-side attributes
  # (`messaging.rabbitmq.message.delivery_tag`).
  - type: messaging.rabbitmq.send.producer
    kind: producer
    stability: development
    brief: Describes a RabbitMQ `send` operation.
    name:
      note: &rabbitmq-span-name >
        RabbitMQ span names SHOULD follow the general
        [span naming guidance](/docs/messaging/messaging-spans.md#span-name):
        `{messaging.operation.name} {destination}`.
    attributes: &rabbitmq-producer-attributes
      - ref_group: messaging.attributes
      - ref_group: messaging.rabbitmq.attributes
      - ref: messaging.destination.name
        note: |
          In RabbitMQ, the destination is defined by an *exchange*, a *routing key* and for consumers, a *queue*.

          `messaging.destination.name` SHOULD be set to:

          - **On the producer side**: `{exchange}:{routing key}` when both values are present and non-empty.
          When only one is available, only that value SHOULD be used. E.g., `{exchange}` or `{routing key}`.
          Otherwise: `amq.default` when the default exchange is used and no routing key is provided

          - **On the consumer side**: `{exchange}:{routing key}:{queue}` when all values are present and non-empty.
          If any has an empty value (e.g., the default exchange is used) it SHOULD be omitted.
          For cases when `{routing key}` and `{queue}` are equal, only one of them SHOULD
          be used, e.g., `{exchange}:{routing key}`.
        examples: ['direct_logs:warning', 'logs']
        requirement_level: required
      - ref: messaging.message.conversation_id
        brief: >
          Message [correlation Id](https://www.rabbitmq.com/tutorials/tutorial-six-java#correlation-id) property.

  # Consumer spans add consumer-side attributes on top of the producer set.
  - type: messaging.rabbitmq.receive.client
    kind: client
    stability: development
    brief: Describes a RabbitMQ `receive` operation.
    name:
      note: *rabbitmq-span-name
    attributes: &rabbitmq-consumer-attributes
      - ref_group: messaging.attributes
      - ref_group: messaging.rabbitmq.attributes
      - ref: messaging.destination.name
        note: |
          In RabbitMQ, the destination is defined by an *exchange*, a *routing key* and for consumers, a *queue*.

          `messaging.destination.name` SHOULD be set to:

          - **On the producer side**: `{exchange}:{routing key}` when both values are present and non-empty.
          When only one is available, only that value SHOULD be used. E.g., `{exchange}` or `{routing key}`.
          Otherwise: `amq.default` when the default exchange is used and no routing key is provided

          - **On the consumer side**: `{exchange}:{routing key}:{queue}` when all values are present and non-empty.
          If any has an empty value (e.g., the default exchange is used) it SHOULD be omitted.
          For cases when `{routing key}` and `{queue}` are equal, only one of them SHOULD
          be used, e.g., `{exchange}:{routing key}`.
        examples: ['direct_logs:warning', 'logs']
        requirement_level: required
      - ref: messaging.message.conversation_id
        brief: >
          Message [correlation Id](https://www.rabbitmq.com/tutorials/tutorial-six-java#correlation-id) property.
      - ref: messaging.rabbitmq.message.delivery_tag
        requirement_level:
          conditionally_required: When available.

  - type: messaging.rabbitmq.process.consumer
    kind: consumer
    stability: development
    brief: Describes a RabbitMQ `process` operation.
    name:
      note: *rabbitmq-span-name
    attributes: *rabbitmq-consumer-attributes

  - type: messaging.rabbitmq.settle.client
    kind: client
    stability: development
    brief: Describes a RabbitMQ `settle` operation.
    name:
      note: *rabbitmq-span-name
    attributes: *rabbitmq-consumer-attributes
