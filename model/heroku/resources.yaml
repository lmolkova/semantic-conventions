# yaml-language-server: $schema=https://raw.githubusercontent.com/open-telemetry/weaver/v0.26.1/schemas/semconv.schema.v2.json
file_format: definition/2
attribute_groups:
  - id: heroku
    visibility: public
    stability: development
    annotations:
      compatibility:
        policy_exceptions: [entity_missing]
    brief: >
      [Heroku dyno metadata](https://devcenter.heroku.com/articles/dyno-metadata)
    attributes:
      - ref: heroku.release.creation_timestamp
        requirement_level: opt_in
      - ref: heroku.release.commit
        requirement_level: opt_in
      - ref: heroku.app.id
        requirement_level: opt_in
