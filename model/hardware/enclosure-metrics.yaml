file_format: definition/2

attribute_groups:
  - id: metric_attributes.hw.enclosure
    visibility: internal
    attributes:
      - ref_group: hardware.attributes.common
      - ref: hw.bios_version
        requirement_level: recommended
      - ref: hw.model
        requirement_level: recommended
      - ref: hw.serial_number
        requirement_level: recommended
      - ref: hw.enclosure.type
        requirement_level: recommended
      - ref: hw.vendor
        requirement_level: recommended

# ENCLOSURE METRICS
metric_refinements:
  - id: hw.status.enclosure
    ref: hw.status
    attributes:
      - ref_group: metric_attributes.hw.enclosure
