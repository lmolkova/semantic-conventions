file_format: definition/2

attribute_groups:
  - id: metric_attributes.hw.cpu
    visibility: internal
    attributes:
      - ref_group: hardware.attributes.common
      - ref: hw.model
        requirement_level: recommended
      - ref: hw.vendor
        requirement_level: recommended

# CPU METRICS
metrics:
  - name: hw.cpu.speed
    stability: development
    brief: "CPU current frequency."
    instrument: gauge
    unit: "Hz"
    annotations:
      code_generation:
        metric_value_type: int
    attributes:
      - ref_group: metric_attributes.hw.cpu

  # TODO: decide on metric name speed.limit is original
  - name: hw.cpu.speed.limit
    stability: development
    brief: "CPU maximum frequency."
    instrument: gauge
    unit: "Hz"
    annotations:
      code_generation:
        metric_value_type: int
    attributes:
      - ref_group: metric_attributes.hw.cpu
      - ref: hw.limit_type
        examples: ["throttled", "max", "turbo"]
        requirement_level: recommended

metric_refinements:
  - id: hw.errors.cpu
    ref: hw.errors
    attributes:
      - ref_group: metric_attributes.hw.cpu

  - id: hw.status.cpu
    ref: hw.status
    attributes:
      - ref_group: metric_attributes.hw.cpu
