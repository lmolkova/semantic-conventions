file_format: definition/2

attribute_groups:
  - id: metric_attributes.hw.temperature.common
    visibility: internal
    attributes:
      - ref_group: hardware.attributes.common
      - ref: hw.sensor_location
        requirement_level: recommended

# TEMPERATURE METRICS
metrics:
  - name: hw.temperature
    stability: development
    brief: "Temperature in degrees Celsius."
    instrument: gauge
    unit: "Cel"
    annotations:
      code_generation:
        metric_value_type: double
    attributes:
      - ref_group: metric_attributes.hw.temperature.common

  - name: hw.temperature.limit
    stability: development
    brief: "Temperature limit in degrees Celsius."
    instrument: gauge
    unit: "Cel"
    annotations:
      code_generation:
        metric_value_type: double
    attributes:
      - ref_group: metric_attributes.hw.temperature.common
      - ref: hw.limit_type
        examples: ["low.critical", "low.degraded", "high.degraded", "high.critical"]
        requirement_level: recommended

metric_refinements:
  - id: hw.status.temperature
    ref: hw.status
    attributes:
      - ref_group: metric_attributes.hw.temperature.common
