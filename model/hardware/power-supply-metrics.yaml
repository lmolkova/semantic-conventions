file_format: definition/2

attribute_groups:
  - id: metric_attributes.hw.power_supply
    visibility: internal
    attributes:
      - ref_group: hardware.attributes.common
      - ref: hw.model
        requirement_level: recommended
      - ref: hw.serial_number
        requirement_level: recommended
      - ref: hw.vendor
        requirement_level: recommended

# POWER SUPPLY METRICS
metrics:
  - name: hw.power_supply.limit
    stability: development
    brief: "Maximum power output of the power supply."
    instrument: updowncounter
    unit: "W"
    annotations:
      code_generation:
        metric_value_type: int
    attributes:
      - ref_group: metric_attributes.hw.power_supply
      - ref: hw.limit_type
        examples: ["max", "critical", "throttled"]
        requirement_level: recommended

  - name: hw.power_supply.utilization
    stability: development
    brief: "Utilization of the power supply as a fraction of its maximum output."
    instrument: gauge
    unit: "1"
    annotations:
      code_generation:
        metric_value_type: double
    attributes:
      - ref_group: metric_attributes.hw.power_supply

  - name: hw.power_supply.usage
    stability: development
    brief: "Current power output of the power supply."
    instrument: updowncounter
    unit: "W"
    annotations:
      code_generation:
        metric_value_type: double
    attributes:
      - ref_group: metric_attributes.hw.power_supply

metric_refinements:
  - id: hw.status.power_supply
    ref: hw.status
    attributes:
      - ref_group: metric_attributes.hw.power_supply
