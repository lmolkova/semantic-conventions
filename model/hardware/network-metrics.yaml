file_format: definition/2

# Common attributes for network adapter metrics. Internal: included into each
# network metric (and into the network refinements of the shared hw.* metrics)
# rather than rendered on its own.
attribute_groups:
  - id: metric_attributes.hw.network
    visibility: internal
    attributes:
      - ref_group: hardware.attributes.common
      - ref: hw.model
        requirement_level: recommended
      - ref: hw.network.logical_addresses
        requirement_level: recommended
      - ref: hw.network.physical_address
        requirement_level: recommended
      - ref: hw.serial_number
        requirement_level: recommended
      - ref: hw.vendor
        requirement_level: recommended

# NETWORK METRICS
metrics:
  - name: hw.network.bandwidth.limit
    stability: development
    brief: "Link speed."
    instrument: updowncounter
    unit: "By/s"
    annotations:
      code_generation:
        metric_value_type: int
    attributes:
      - ref_group: metric_attributes.hw.network

  - name: hw.network.bandwidth.utilization
    stability: development
    brief: "Utilization of the network bandwidth as a fraction."
    instrument: gauge
    unit: "1"
    annotations:
      code_generation:
        metric_value_type: double
    attributes:
      - ref_group: metric_attributes.hw.network

  - name: hw.network.io
    stability: development
    brief: "Received and transmitted network traffic in bytes."
    instrument: counter
    unit: "By"
    annotations:
      code_generation:
        metric_value_type: int
    attributes:
      - ref_group: metric_attributes.hw.network
      - ref: network.io.direction
        examples: ["receive", "transmit"]
        requirement_level: required

  - name: hw.network.packets
    stability: development
    brief: "Received and transmitted network traffic in packets (or frames)."
    instrument: counter
    unit: "{packet}"
    annotations:
      code_generation:
        metric_value_type: int
    attributes:
      - ref_group: metric_attributes.hw.network
      - ref: network.io.direction
        examples: ["receive", "transmit"]
        requirement_level: required

  - name: hw.network.up
    stability: development
    brief: "Link status: `1` (up) or `0` (down)."
    instrument: updowncounter
    unit: "1"
    annotations:
      code_generation:
        metric_value_type: int
    attributes:
      - ref_group: metric_attributes.hw.network

# Network-specific refinements of the shared hw.* metrics: stamp the network
# common attributes onto hw.errors / hw.status when reported for a network adapter.
metric_refinements:
  - id: hw.errors.network
    ref: hw.errors
    attributes:
      - ref_group: metric_attributes.hw.network

  - id: hw.status.network
    ref: hw.status
    attributes:
      - ref_group: metric_attributes.hw.network
