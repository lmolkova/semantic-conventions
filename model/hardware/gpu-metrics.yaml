file_format: definition/2

attribute_groups:
  - id: metric_attributes.hw.gpu
    visibility: internal
    attributes:
      - ref_group: hardware.attributes.common
      - ref: hw.driver_version
        requirement_level: recommended
      - ref: hw.firmware_version
        requirement_level: recommended
      - ref: hw.model
        requirement_level: recommended
      - ref: hw.serial_number
        requirement_level: recommended
      - ref: hw.vendor
        requirement_level: recommended

# GPU METRICS
metrics:
  - name: hw.gpu.io
    stability: development
    brief: "Received and transmitted bytes by the GPU."
    instrument: counter
    unit: "By"
    annotations:
      code_generation:
        metric_value_type: int
    attributes:
      - ref_group: metric_attributes.hw.gpu
      - ref: network.io.direction
        examples: ["receive", "transmit"]
        requirement_level: required

  - name: hw.gpu.memory.limit
    stability: development
    brief: "Size of the GPU memory."
    instrument: updowncounter
    unit: "By"
    annotations:
      code_generation:
        metric_value_type: int
    attributes:
      - ref_group: metric_attributes.hw.gpu

  - name: hw.gpu.memory.utilization
    stability: development
    brief: "Fraction of GPU memory used."
    instrument: gauge
    unit: "1"
    annotations:
      code_generation:
        metric_value_type: double
    attributes:
      - ref_group: metric_attributes.hw.gpu

  - name: hw.gpu.memory.usage
    stability: development
    brief: "GPU memory used."
    instrument: updowncounter
    unit: "By"
    annotations:
      code_generation:
        metric_value_type: int
    attributes:
      - ref_group: metric_attributes.hw.gpu

  - name: hw.gpu.utilization
    stability: development
    brief: "Fraction of time spent in a specific task."
    instrument: gauge
    unit: "1"
    annotations:
      code_generation:
        metric_value_type: double
    attributes:
      - ref_group: metric_attributes.hw.gpu
      - ref: hw.gpu.task
        examples: ["decoder", "encoder", "general"]
        requirement_level: recommended

metric_refinements:
  - id: hw.errors.gpu
    ref: hw.errors
    attributes:
      - ref_group: metric_attributes.hw.gpu

  - id: hw.status.gpu
    ref: hw.status
    attributes:
      - ref_group: metric_attributes.hw.gpu
