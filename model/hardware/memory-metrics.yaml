file_format: definition/2

attribute_groups:
  - id: metric_attributes.hw.memory
    visibility: internal
    attributes:
      - ref_group: hardware.attributes.common
      - ref: hw.model
        requirement_level: recommended
      - ref: hw.serial_number
        requirement_level: recommended
      - ref: hw.memory.type
        requirement_level: recommended
      - ref: hw.vendor
        requirement_level: recommended

# MEMORY METRICS
metrics:
  - name: hw.memory.size
    stability: development
    brief: "Size of the memory module."
    instrument: updowncounter
    unit: "By"
    annotations:
      code_generation:
        metric_value_type: int
    attributes:
      - ref_group: metric_attributes.hw.memory

metric_refinements:
  - id: hw.errors.memory
    ref: hw.errors
    attributes:
      - ref_group: metric_attributes.hw.memory

  - id: hw.status.memory
    ref: hw.status
    attributes:
      - ref_group: metric_attributes.hw.memory
