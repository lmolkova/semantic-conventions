file_format: definition/2

attribute_groups:
  - id: metric_attributes.hw.fan
    visibility: internal
    attributes:
      - ref_group: hardware.attributes.common
      - ref: hw.sensor_location
        requirement_level: recommended

# FAN METRICS
metrics:
  - name: hw.fan.speed
    stability: development
    brief: "Fan speed in revolutions per minute."
    instrument: gauge
    unit: "rpm"
    annotations:
      code_generation:
        metric_value_type: int
    attributes:
      - ref_group: metric_attributes.hw.fan

  - name: hw.fan.speed.limit
    stability: development
    brief: "Speed limit in rpm."
    instrument: gauge
    unit: "rpm"
    annotations:
      code_generation:
        metric_value_type: int
    attributes:
      - ref_group: metric_attributes.hw.fan
      - ref: hw.limit_type
        examples: ["low.critical", "low.degraded", "max"]
        requirement_level: recommended

  - name: hw.fan.speed_ratio
    stability: development
    brief: "Fan speed expressed as a fraction of its maximum speed."
    instrument: gauge
    unit: "1"
    annotations:
      code_generation:
        metric_value_type: double
    attributes:
      - ref_group: metric_attributes.hw.fan

metric_refinements:
  - id: hw.status.fan
    ref: hw.status
    attributes:
      - ref_group: metric_attributes.hw.fan
