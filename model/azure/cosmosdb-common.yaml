file_format: definition/2

attribute_groups:
  - id: azure.cosmosdb.client.connection
    visibility: internal
    attributes:
      - ref: db.system.name
        requirement_level: required
        annotations:
          markdown:
            omit_enum_table: true
        note: MUST be set to `"azure.cosmosdb"`.
        examples: ["azure.cosmosdb"]

  - id: azure.cosmosdb.client.operation
    visibility: internal
    attributes:
      - ref: azure.cosmosdb.consistency.level
        requirement_level:
          conditionally_required: If available.
      - ref: db.collection.name
        requirement_level:
          conditionally_required: If available.
        brief: >
          Cosmos DB container name.
        note: >
          It is RECOMMENDED to capture the value as provided by the application without attempting to do any case normalization.
      - ref: db.namespace
        requirement_level:
          conditionally_required: If available.
        note: ""
      - ref: db.operation.name
        requirement_level: required
        note: |
          The `db.operation.name` has the following list of well-known values.
          If one of them applies, then the respective value MUST be used.

          Batch operations:

          - `execute_batch`

          Bulk operations:

          - `execute_bulk` SHOULD be used for calls to methods like
            [`executeBulkOperations`](https://javadoc.io/doc/com.azure/azure-cosmos/latest/com/azure/cosmos/CosmosAsyncContainer.html),
            which represents a bulk execution of multiple operations.
          - `bulk_{operation name}` (`bulk_create_item`, `bulk_upsert_item`, etc) SHOULD be used for individual operations (when they are reported)
            within the bulk. This pattern SHOULD be used when instrumentation reports each operation separately, but operations are buffered and then performed in bulk.
            For example, this applies when [`AllowBulkExecution`](https://learn.microsoft.com/dotnet/api/microsoft.azure.cosmos.cosmosclientoptions.allowbulkexecution)
            property is configured on the `Microsoft.Azure.Cosmos` client.

          Change feed operations:

          - `query_change_feed`

          Conflicts operations:

          - `delete_conflict`
          - `query_conflicts`
          - `read_all_conflicts`
          - `read_conflict`

          Container operations:

          - `create_container`
          - `create_container_if_not_exists`
          - `delete_container`
          - `query_containers`
          - `read_all_containers`
          - `read_container`
          - `read_container_throughput`
          - `replace_container`
          - `replace_container_throughput`

          Database operations:

          - `create_database`
          - `create_database_if_not_exists`
          - `delete_database`
          - `query_databases`
          - `read_all_databases`
          - `read_database`
          - `read_database_throughput`
          - `replace_database_throughput`

          Encryption key operations:

          - `create_client_encryption_key`
          - `query_client_encryption_keys`
          - `read_all_client_encryption_keys`
          - `read_client_encryption_key`
          - `replace_client_encryption_key`

          Item operations:

          - `create_item`
          - `delete_all_items_by_partition_key`
          - `delete_item`
          - `patch_item`
          - `query_items`
          - `read_all_items`
          - `read_all_items_of_logical_partition`
          - `read_many_items`
          - `read_item`
          - `replace_item`
          - `upsert_item`

          Permission operations:

          - `create_permission`
          - `delete_permission`
          - `query_permissions`
          - `read_all_permissions`
          - `read_permission`
          - `replace_permission`
          - `upsert_permission`

          Stored procedure operations:

          - `create_stored_procedure`
          - `delete_stored_procedure`
          - `execute_stored_procedure`
          - `query_stored_procedures`
          - `read_all_stored_procedures`
          - `read_stored_procedure`
          - `replace_stored_procedure`

          Trigger operations:

          - `create_trigger`
          - `delete_trigger`
          - `query_triggers`
          - `read_all_triggers`
          - `read_trigger`
          - `replace_trigger`

          User operations:

          - `create_user`
          - `delete_user`
          - `query_users`
          - `read_all_users`
          - `read_user`
          - `replace_user`
          - `upsert_user`

          User-defined function operations:

          - `create_user_defined_function`
          - `delete_user_defined_function`
          - `query_user_defined_functions`
          - `read_all_user_defined_functions`
          - `read_user_defined_function`

          If none of them applies, it's RECOMMENDED to use language-agnostic representation of
          client method name in snake_case. Instrumentations SHOULD document
          additional values when introducing new operations.
        examples: ['create_item', 'query_items', 'read_item']

  - id: azure.cosmosdb.client.response
    visibility: internal
    attributes:
      - ref_group: db.response
      - ref: azure.cosmosdb.response.sub_status_code
        requirement_level:
          conditionally_required: when response was received and contained sub-code.
      - ref: db.response.status_code
        requirement_level:
          conditionally_required: if response was received
        brief: >
          Cosmos DB status code.
        examples: ["200", "201"]
        note: >
          Response codes in the 4xx and 5xx range SHOULD be considered errors.
