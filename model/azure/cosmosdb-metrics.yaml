file_format: definition/2

attribute_groups:
  - id: azure.cosmosdb.client.metrics
    visibility: internal
    attributes:
      - ref: azure.cosmosdb.operation.contacted_regions
        requirement_level:
          recommended: If available

metrics:
  - name: azure.cosmosdb.client.operation.request_charge
    annotations:
      code_generation:
        metric_value_type: double
    brief: "[Request units](https://learn.microsoft.com/azure/cosmos-db/request-units) consumed by the operation."
    instrument: histogram
    unit: "{request_unit}"
    stability: development
    attributes:
      - ref_group: db.client.connection
      - ref: server.port
        requirement_level:
          conditionally_required: If not default (443).
      - ref_group: azure.cosmosdb.client.response
      - ref_group: azure.cosmosdb.client.connection
      - ref_group: azure.cosmosdb.client.operation
      - ref_group: azure.cosmosdb.client.metrics

  - name: azure.cosmosdb.client.active_instance.count
    annotations:
      code_generation:
        metric_value_type: int
    brief: "Number of active client instances."
    instrument: updowncounter
    unit: "{instance}"
    stability: development
    attributes:
      - ref_group: db.client.connection
      - ref: server.port
        requirement_level:
          conditionally_required: If not default (443).
      - ref_group: azure.cosmosdb.client.connection

metric_refinements:
  - id: metric.azure.cosmosdb.client.operation.duration
    ref: db.client.operation.duration
    brief: Total time taken by an Azure Cosmos DB operation.
    attributes:
      - unref: db.query.summary
      - unref: db.query.text
      - unref: db.stored_procedure.name
      - unref: network.peer.address
      - unref: network.peer.port
      - ref_group: db.client.connection
      - ref: server.port
        requirement_level:
          conditionally_required: If not default (443).
      - ref_group: azure.cosmosdb.client.response
      - ref_group: azure.cosmosdb.client.connection
      - ref_group: azure.cosmosdb.client.operation
      - ref_group: azure.cosmosdb.client.metrics

  - id: metric.azure.cosmosdb.client.response.returned_rows
    ref: db.client.response.returned_rows
    brief: Number of items returned by a query or feed operation in Azure Cosmos DB.
    attributes:
      - unref: db.query.summary
      - unref: db.query.text
      - unref: network.peer.address
      - unref: network.peer.port
      - ref_group: db.client.connection
      - ref: server.port
        requirement_level:
          conditionally_required: If not default (443).
      - ref_group: azure.cosmosdb.client.response
      - ref_group: azure.cosmosdb.client.connection
      - ref_group: azure.cosmosdb.client.operation
      - ref_group: azure.cosmosdb.client.metrics
