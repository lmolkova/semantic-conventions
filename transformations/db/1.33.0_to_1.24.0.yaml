# Database: stable (v1.33.0) -> pre-stability (v1.24.0), spans and metrics.
#
# Lets dashboards written against v1.24 DB conventions also see data from
# v1.33 producers. Written independently of the forward set.
# Target-safety: every trace policy matches on `db.system.name` (absent from
# v1.24 spans); every metric policy matches on a metric name that v1.24
# doesn't use.
#
# Left out (not bridgeable / not expressible):
#   - span name change (no span-name op)
#   - attributes v1.33 removed (db.connection_string, db.user, db.instance.id,
#     db.mssql.instance_name, network.transport, network.type): no source data
#   - qualified db.namespace values ("a|b") can't be split into db.name /
#     db.mssql.instance_name (needs `derive`)
#   - db.collection.name for systems with no v1.24 equivalent key
#   - stable-only attributes and db.client.operation.duration: extra in
#     source, ignored
file_format: transform/2.0
source_schema_url: https://opentelemetry.io/schemas/1.33.0
target_schema_url: https://opentelemetry.io/schemas/1.24.0

policies:
  # =========================================================================
  # Spans
  # =========================================================================
  - id: db-span-common-rev
    name: db.query.text and db.operation.name renamed back
    description: >
      v1.33 db.query.text SHOULD be sanitized by default, so exact-match
      filters written for raw v1.24 statements may not match.
    trace:
      match:
        - {span_attribute: [db.system.name], exists: true}
      transform:
        rename:
          - {span_attribute: [db.query.text], to: db.statement}
          - {span_attribute: [db.operation.name], to: db.operation}

  # --- db.collection.name -> per-system key --------------------------------
  - id: db-span-collection-sql-rev
    name: db.collection.name becomes db.sql.table on SQL systems
    description: >
      The SQL system list is a judgement call (v1.24 applied db.sql.table to
      "SQL databases" without enumerating them). softwareag.adabas is left out.
    trace:
      match:
        - {span_attribute: [db.system.name], regex: "^(other_sql|mysql|mariadb|postgresql|microsoft\\.sql_server|oracle\\.db|ibm\\.db2|sqlite|h2database|hsqldb|\
            derby|firebirdsql|sap\\.hana|sap\\.maxdb|ibm\\.informix|actian\\.ingres|ibm\\.netezza|aws\\.redshift|\
            gcp\\.spanner|cockroachdb|clickhouse|trino|teradata|hive|instantdb|intersystems\\.cache)$"}
      transform:
        rename:
          - {span_attribute: [db.collection.name], to: db.sql.table}

  - id: db-span-collection-cassandra-rev
    name: db.collection.name becomes db.cassandra.table
    trace:
      match:
        - {span_attribute: [db.system.name], exact: cassandra}
      transform:
        rename:
          - {span_attribute: [db.collection.name], to: db.cassandra.table}

  - id: db-span-collection-mongodb-rev
    name: db.collection.name becomes db.mongodb.collection
    trace:
      match:
        - {span_attribute: [db.system.name], exact: mongodb}
      transform:
        rename:
          - {span_attribute: [db.collection.name], to: db.mongodb.collection}

  - id: db-span-collection-cosmosdb-rev
    name: db.collection.name becomes db.cosmosdb.container
    trace:
      match:
        - {span_attribute: [db.system.name], exact: azure.cosmosdb}
      transform:
        rename:
          - {span_attribute: [db.collection.name], to: db.cosmosdb.container}

  # --- db.namespace -> db.name / db.redis.database_index / cluster name -----
  - id: db-span-namespace-rev
    name: db.namespace becomes db.name when it has a single component
    description: >
      Values containing "|" ({instance}|{database} on SQL Server,
      {database}|{schema} on PostgreSQL, {instance}|{database}|{service} on
      Oracle) are left as db.namespace: splitting them needs `derive`.
    trace:
      match:
        - {span_attribute: [db.system.name], exists: true}
        - {span_attribute: [db.system.name], regex: "^(redis|elasticsearch)$", negate: true}
        - {span_attribute: [db.namespace], contains: "|", negate: true}
      transform:
        rename:
          - {span_attribute: [db.namespace], to: db.name}

  - id: db-span-namespace-redis-rev
    name: db.namespace (string) becomes db.redis.database_index (int)
    trace:
      match:
        - {span_attribute: [db.system.name], exact: redis}
      transform:
        convert:
          - {span_attribute: [db.namespace], type: int}
        rename:
          - {span_attribute: [db.namespace], to: db.redis.database_index}

  - id: db-span-namespace-elasticsearch-rev
    name: db.namespace becomes db.elasticsearch.cluster.name
    description: Not in the guide's table; schema 1.27.0 renamed it forward.
    trace:
      match:
        - {span_attribute: [db.system.name], exact: elasticsearch}
      transform:
        rename:
          - {span_attribute: [db.namespace], to: db.elasticsearch.cluster.name}

  # --- db.system.name -> db.system -----------------------------------------
  - id: db-span-system-unchanged-rev
    name: db.system.name becomes db.system for values that keep their spelling
    trace:
      match:
        - {span_attribute: [db.system.name], exists: true}
        - {span_attribute: [db.system.name], regex: "^(softwareag\\.adabas|intersystems\\.cache|azure\\.cosmosdb|ibm\\.db2|aws\\.dynamodb|firebirdsql|h2database|\
            sap\\.hana|ibm\\.informix|actian\\.ingres|sap\\.maxdb|microsoft\\.sql_server|ibm\\.netezza|oracle\\.db|\
            aws\\.redshift|gcp\\.spanner)$", negate: true}
      transform:
        rename:
          - {span_attribute: [db.system.name], to: db.system}

  # One policy per renamed enum value (no `map` op). Each requires db.system
  # to be absent so dual-emitting producers keep their value.
  - id: db-span-system-adabas-rev
    name: db.system.name=softwareag.adabas becomes db.system=adabas
    trace:
      match:
        - {span_attribute: [db.system.name], exact: softwareag.adabas}
        - {span_attribute: [db.system], exists: false}
      transform:
        rename: [{span_attribute: [db.system.name], to: db.system}]
        add: [{span_attribute: [db.system], value: adabas, upsert: true}]

  - id: db-span-system-cache-rev
    name: db.system.name=intersystems.cache becomes db.system=cache
    description: v1.24 only had `cache`; intersystems_cache came later.
    trace:
      match:
        - {span_attribute: [db.system.name], exact: intersystems.cache}
        - {span_attribute: [db.system], exists: false}
      transform:
        rename: [{span_attribute: [db.system.name], to: db.system}]
        add: [{span_attribute: [db.system], value: cache, upsert: true}]

  - id: db-span-system-cosmosdb-rev
    name: db.system.name=azure.cosmosdb becomes db.system=cosmosdb
    trace:
      match:
        - {span_attribute: [db.system.name], exact: azure.cosmosdb}
        - {span_attribute: [db.system], exists: false}
      transform:
        rename: [{span_attribute: [db.system.name], to: db.system}]
        add: [{span_attribute: [db.system], value: cosmosdb, upsert: true}]

  - id: db-span-system-db2-rev
    name: db.system.name=ibm.db2 becomes db.system=db2
    trace:
      match:
        - {span_attribute: [db.system.name], exact: ibm.db2}
        - {span_attribute: [db.system], exists: false}
      transform:
        rename: [{span_attribute: [db.system.name], to: db.system}]
        add: [{span_attribute: [db.system], value: db2, upsert: true}]

  - id: db-span-system-dynamodb-rev
    name: db.system.name=aws.dynamodb becomes db.system=dynamodb
    trace:
      match:
        - {span_attribute: [db.system.name], exact: aws.dynamodb}
        - {span_attribute: [db.system], exists: false}
      transform:
        rename: [{span_attribute: [db.system.name], to: db.system}]
        add: [{span_attribute: [db.system], value: dynamodb, upsert: true}]

  - id: db-span-system-firebird-rev
    name: db.system.name=firebirdsql becomes db.system=firebird
    trace:
      match:
        - {span_attribute: [db.system.name], exact: firebirdsql}
        - {span_attribute: [db.system], exists: false}
      transform:
        rename: [{span_attribute: [db.system.name], to: db.system}]
        add: [{span_attribute: [db.system], value: firebird, upsert: true}]

  - id: db-span-system-h2-rev
    name: db.system.name=h2database becomes db.system=h2
    trace:
      match:
        - {span_attribute: [db.system.name], exact: h2database}
        - {span_attribute: [db.system], exists: false}
      transform:
        rename: [{span_attribute: [db.system.name], to: db.system}]
        add: [{span_attribute: [db.system], value: h2, upsert: true}]

  - id: db-span-system-hanadb-rev
    name: db.system.name=sap.hana becomes db.system=hanadb
    trace:
      match:
        - {span_attribute: [db.system.name], exact: sap.hana}
        - {span_attribute: [db.system], exists: false}
      transform:
        rename: [{span_attribute: [db.system.name], to: db.system}]
        add: [{span_attribute: [db.system], value: hanadb, upsert: true}]

  - id: db-span-system-informix-rev
    name: db.system.name=ibm.informix becomes db.system=informix
    trace:
      match:
        - {span_attribute: [db.system.name], exact: ibm.informix}
        - {span_attribute: [db.system], exists: false}
      transform:
        rename: [{span_attribute: [db.system.name], to: db.system}]
        add: [{span_attribute: [db.system], value: informix, upsert: true}]

  - id: db-span-system-ingres-rev
    name: db.system.name=actian.ingres becomes db.system=ingres
    trace:
      match:
        - {span_attribute: [db.system.name], exact: actian.ingres}
        - {span_attribute: [db.system], exists: false}
      transform:
        rename: [{span_attribute: [db.system.name], to: db.system}]
        add: [{span_attribute: [db.system], value: ingres, upsert: true}]

  - id: db-span-system-maxdb-rev
    name: db.system.name=sap.maxdb becomes db.system=maxdb
    trace:
      match:
        - {span_attribute: [db.system.name], exact: sap.maxdb}
        - {span_attribute: [db.system], exists: false}
      transform:
        rename: [{span_attribute: [db.system.name], to: db.system}]
        add: [{span_attribute: [db.system], value: maxdb, upsert: true}]

  - id: db-span-system-mssql-rev
    name: db.system.name=microsoft.sql_server becomes db.system=mssql
    trace:
      match:
        - {span_attribute: [db.system.name], exact: microsoft.sql_server}
        - {span_attribute: [db.system], exists: false}
      transform:
        rename: [{span_attribute: [db.system.name], to: db.system}]
        add: [{span_attribute: [db.system], value: mssql, upsert: true}]

  - id: db-span-system-netezza-rev
    name: db.system.name=ibm.netezza becomes db.system=netezza
    trace:
      match:
        - {span_attribute: [db.system.name], exact: ibm.netezza}
        - {span_attribute: [db.system], exists: false}
      transform:
        rename: [{span_attribute: [db.system.name], to: db.system}]
        add: [{span_attribute: [db.system], value: netezza, upsert: true}]

  - id: db-span-system-oracle-rev
    name: db.system.name=oracle.db becomes db.system=oracle
    trace:
      match:
        - {span_attribute: [db.system.name], exact: oracle.db}
        - {span_attribute: [db.system], exists: false}
      transform:
        rename: [{span_attribute: [db.system.name], to: db.system}]
        add: [{span_attribute: [db.system], value: oracle, upsert: true}]

  - id: db-span-system-redshift-rev
    name: db.system.name=aws.redshift becomes db.system=redshift
    trace:
      match:
        - {span_attribute: [db.system.name], exact: aws.redshift}
        - {span_attribute: [db.system], exists: false}
      transform:
        rename: [{span_attribute: [db.system.name], to: db.system}]
        add: [{span_attribute: [db.system], value: redshift, upsert: true}]

  - id: db-span-system-spanner-rev
    name: db.system.name=gcp.spanner becomes db.system=spanner
    trace:
      match:
        - {span_attribute: [db.system.name], exact: gcp.spanner}
        - {span_attribute: [db.system], exists: false}
      transform:
        rename: [{span_attribute: [db.system.name], to: db.system}]
        add: [{span_attribute: [db.system], value: spanner, upsert: true}]

  # =========================================================================
  # Metrics (experimental connection metrics)
  # =========================================================================
  - id: db-conn-count-rev
    name: db.client.connection.count becomes db.client.connections.usage
    metric:
      match: [{metric_field: name, exact: db.client.connection.count}]
      transform:
        rename:
          - {metric_field: name, to: db.client.connections.usage}
          - {datapoint_attribute: [db.client.connection.pool.name], to: pool.name}
          - {datapoint_attribute: [db.client.connection.state], to: state}

  - id: db-conn-idle-max-rev
    name: db.client.connection.idle.max becomes db.client.connections.idle.max
    metric:
      match: [{metric_field: name, exact: db.client.connection.idle.max}]
      transform:
        rename:
          - {metric_field: name, to: db.client.connections.idle.max}
          - {datapoint_attribute: [db.client.connection.pool.name], to: pool.name}

  - id: db-conn-idle-min-rev
    name: db.client.connection.idle.min becomes db.client.connections.idle.min
    metric:
      match: [{metric_field: name, exact: db.client.connection.idle.min}]
      transform:
        rename:
          - {metric_field: name, to: db.client.connections.idle.min}
          - {datapoint_attribute: [db.client.connection.pool.name], to: pool.name}

  - id: db-conn-max-rev
    name: db.client.connection.max becomes db.client.connections.max
    metric:
      match: [{metric_field: name, exact: db.client.connection.max}]
      transform:
        rename:
          - {metric_field: name, to: db.client.connections.max}
          - {datapoint_attribute: [db.client.connection.pool.name], to: pool.name}

  - id: db-conn-pending-requests-rev
    name: db.client.connection.pending_requests becomes db.client.connections.pending_requests
    metric:
      match: [{metric_field: name, exact: db.client.connection.pending_requests}]
      transform:
        rename:
          - {metric_field: name, to: db.client.connections.pending_requests}
          - {datapoint_attribute: [db.client.connection.pool.name], to: pool.name}

  - id: db-conn-timeouts-rev
    name: db.client.connection.timeouts becomes db.client.connections.timeouts
    metric:
      match: [{metric_field: name, exact: db.client.connection.timeouts}]
      transform:
        rename:
          - {metric_field: name, to: db.client.connections.timeouts}
          - {datapoint_attribute: [db.client.connection.pool.name], to: pool.name}

  - id: db-conn-create-time-rev
    name: db.client.connection.create_time (s) becomes db.client.connections.create_time (ms)
    metric:
      match: [{metric_field: name, exact: db.client.connection.create_time}]
      transform:
        scale:
          - {metric_field: unit, from: s, to: ms}
        rename:
          - {metric_field: name, to: db.client.connections.create_time}
          - {datapoint_attribute: [db.client.connection.pool.name], to: pool.name}

  - id: db-conn-wait-time-rev
    name: db.client.connection.wait_time (s) becomes db.client.connections.wait_time (ms)
    metric:
      match: [{metric_field: name, exact: db.client.connection.wait_time}]
      transform:
        scale:
          - {metric_field: unit, from: s, to: ms}
        rename:
          - {metric_field: name, to: db.client.connections.wait_time}
          - {datapoint_attribute: [db.client.connection.pool.name], to: pool.name}

  - id: db-conn-use-time-rev
    name: db.client.connection.use_time (s) becomes db.client.connections.use_time (ms)
    metric:
      match: [{metric_field: name, exact: db.client.connection.use_time}]
      transform:
        scale:
          - {metric_field: unit, from: s, to: ms}
        rename:
          - {metric_field: name, to: db.client.connections.use_time}
          - {datapoint_attribute: [db.client.connection.pool.name], to: pool.name}
