  # --- Container metrics ----------------------------------------------------
  # The Collector reads limits/requests from the Pod spec, which semconv
  # calls `desired`. `current` (from ContainerStatus) has no source data.
  - id: k8s-container-cpu-limit
    name: k8s.container.cpu_limit becomes k8s.container.cpu.limit.desired
    metric:
      match: [{metric_field: name, exact: k8s.container.cpu_limit}]
      transform:
        rename: [{metric_field: name, to: k8s.container.cpu.limit.desired}]

  - id: k8s-container-cpu-request
    name: k8s.container.cpu_request becomes k8s.container.cpu.request.desired
    metric:
      match: [{metric_field: name, exact: k8s.container.cpu_request}]
      transform:
        rename: [{metric_field: name, to: k8s.container.cpu.request.desired}]

  - id: k8s-container-memory-limit
    name: k8s.container.memory_limit becomes k8s.container.memory.limit.desired
    metric:
      match: [{metric_field: name, exact: k8s.container.memory_limit}]
      transform:
        rename: [{metric_field: name, to: k8s.container.memory.limit.desired}]

  - id: k8s-container-memory-request
    name: k8s.container.memory_request becomes k8s.container.memory.request.desired
    metric:
      match: [{metric_field: name, exact: k8s.container.memory_request}]
      transform:
        rename: [{metric_field: name, to: k8s.container.memory.request.desired}]

  - id: k8s-container-storage-limit
    name: k8s.container.storage_limit becomes k8s.container.storage.limit
    metric:
      match: [{metric_field: name, exact: k8s.container.storage_limit}]
      transform:
        rename: [{metric_field: name, to: k8s.container.storage.limit}]

  - id: k8s-container-storage-request
    name: k8s.container.storage_request becomes k8s.container.storage.request
    metric:
      match: [{metric_field: name, exact: k8s.container.storage_request}]
      transform:
        rename: [{metric_field: name, to: k8s.container.storage.request}]

  - id: k8s-container-ephemeral-storage-limit
    name: k8s.container.ephemeralstorage_limit becomes k8s.container.ephemeral_storage.limit
    metric:
      match: [{metric_field: name, exact: k8s.container.ephemeralstorage_limit}]
      transform:
        rename: [{metric_field: name, to: k8s.container.ephemeral_storage.limit}]

  - id: k8s-container-ephemeral-storage-request
    name: k8s.container.ephemeralstorage_request becomes k8s.container.ephemeral_storage.request
    metric:
      match: [{metric_field: name, exact: k8s.container.ephemeralstorage_request}]
      transform:
        rename: [{metric_field: name, to: k8s.container.ephemeral_storage.request}]

  - id: k8s-container-restarts
    name: k8s.container.restarts becomes k8s.container.restart.count
    metric:
      match: [{metric_field: name, exact: k8s.container.restarts}]
      transform:
        rename: [{metric_field: name, to: k8s.container.restart.count}]

  - id: k8s-container-cpu-limit-utilization
    name: k8s.container.cpu_limit_utilization becomes k8s.container.cpu.limit.utilization
    description: >
      Caveat: the Collector divides by the spec (desired) limit, semconv by the
      current limit from ContainerStatus. They differ only while an in-place
      resize is pending.
    metric:
      match: [{metric_field: name, exact: k8s.container.cpu_limit_utilization}]
      transform:
        rename: [{metric_field: name, to: k8s.container.cpu.limit.utilization}]

  - id: k8s-container-cpu-request-utilization
    name: k8s.container.cpu_request_utilization becomes k8s.container.cpu.request.utilization
    description: >
      Caveat: spec (desired) request vs current request from ContainerStatus;
      differ only while an in-place resize is pending.
    metric:
      match: [{metric_field: name, exact: k8s.container.cpu_request_utilization}]
      transform:
        rename: [{metric_field: name, to: k8s.container.cpu.request.utilization}]

  # --- Pod volume metrics ---------------------------------------------------
  # k8s.volume.name / k8s.volume.type are resource attributes on the old
  # metrics and datapoint attributes on the new ones; that move can't be
  # expressed (see README.md).
  - id: k8s-pod-volume-available
    name: k8s.volume.available becomes k8s.pod.volume.available
    metric:
      match: [{metric_field: name, exact: k8s.volume.available}]
      transform:
        rename: [{metric_field: name, to: k8s.pod.volume.available}]

  - id: k8s-pod-volume-capacity
    name: k8s.volume.capacity becomes k8s.pod.volume.capacity
    metric:
      match: [{metric_field: name, exact: k8s.volume.capacity}]
      transform:
        rename: [{metric_field: name, to: k8s.pod.volume.capacity}]

  - id: k8s-pod-volume-inode-count
    name: k8s.volume.inodes becomes k8s.pod.volume.inode.count
    metric:
      match: [{metric_field: name, exact: k8s.volume.inodes}]
      transform:
        rename: [{metric_field: name, to: k8s.pod.volume.inode.count}]

  - id: k8s-pod-volume-inode-free
    name: k8s.volume.inodes.free becomes k8s.pod.volume.inode.free
    metric:
      match: [{metric_field: name, exact: k8s.volume.inodes.free}]
      transform:
        rename: [{metric_field: name, to: k8s.pod.volume.inode.free}]

  - id: k8s-pod-volume-inode-used
    name: k8s.volume.inodes.used becomes k8s.pod.volume.inode.used
    metric:
      match: [{metric_field: name, exact: k8s.volume.inodes.used}]
      transform:
        rename: [{metric_field: name, to: k8s.pod.volume.inode.used}]

  # --- Paging faults: only the major partition is exact ---------------------
  - id: k8s-pod-major-page-faults
    name: k8s.pod.memory.major_page_faults becomes k8s.pod.paging.faults{type=major}
    metric:
      match: [{metric_field: name, exact: k8s.pod.memory.major_page_faults}]
      transform:
        rename: [{metric_field: name, to: k8s.pod.paging.faults}]
        add: [{datapoint_attribute: [system.paging.fault.type], value: major}]

  - id: k8s-node-major-page-faults
    name: k8s.node.memory.major_page_faults becomes k8s.node.paging.faults{type=major}
    metric:
      match: [{metric_field: name, exact: k8s.node.memory.major_page_faults}]
      transform:
        rename: [{metric_field: name, to: k8s.node.paging.faults}]
        add: [{datapoint_attribute: [system.paging.fault.type], value: major}]

  - id: container-major-page-faults
    name: container.memory.major_page_faults becomes container.paging.faults{type=major}
    metric:
      match: [{metric_field: name, exact: container.memory.major_page_faults}]
      transform:
        rename: [{metric_field: name, to: container.paging.faults}]
        add: [{datapoint_attribute: [system.paging.fault.type], value: major}]

  # --- ResourceQuota metrics: one policy per (metric, resource key) ---------
  # `resource` is pinned by an exact matcher, so removing it never merges
  # series. CPU keys (millicores), bare aliases, hugepages and per-storage-
  # class keys are not covered (see README.md).
  - id: k8s-rq-hard-memory-limit
    name: k8s.resource_quota.hard_limit{resource=limits.memory} becomes k8s.resourcequota.memory.limit.hard
    metric:
      match:
        - {metric_field: name, exact: k8s.resource_quota.hard_limit}
        - {datapoint_attribute: [resource], exact: limits.memory}
      transform:
        remove: [{datapoint_attribute: [resource]}]
        rename: [{metric_field: name, to: k8s.resourcequota.memory.limit.hard}]

  - id: k8s-rq-used-memory-limit
    name: k8s.resource_quota.used{resource=limits.memory} becomes k8s.resourcequota.memory.limit.used
    metric:
      match:
        - {metric_field: name, exact: k8s.resource_quota.used}
        - {datapoint_attribute: [resource], exact: limits.memory}
      transform:
        remove: [{datapoint_attribute: [resource]}]
        rename: [{metric_field: name, to: k8s.resourcequota.memory.limit.used}]

  - id: k8s-rq-hard-memory-request
    name: k8s.resource_quota.hard_limit{resource=requests.memory} becomes k8s.resourcequota.memory.request.hard
    metric:
      match:
        - {metric_field: name, exact: k8s.resource_quota.hard_limit}
        - {datapoint_attribute: [resource], exact: requests.memory}
      transform:
        remove: [{datapoint_attribute: [resource]}]
        rename: [{metric_field: name, to: k8s.resourcequota.memory.request.hard}]

  - id: k8s-rq-used-memory-request
    name: k8s.resource_quota.used{resource=requests.memory} becomes k8s.resourcequota.memory.request.used
    metric:
      match:
        - {metric_field: name, exact: k8s.resource_quota.used}
        - {datapoint_attribute: [resource], exact: requests.memory}
      transform:
        remove: [{datapoint_attribute: [resource]}]
        rename: [{metric_field: name, to: k8s.resourcequota.memory.request.used}]

  - id: k8s-rq-hard-ephemeral-storage-limit
    name: k8s.resource_quota.hard_limit{resource=limits.ephemeral-storage} becomes k8s.resourcequota.ephemeral_storage.limit.hard
    metric:
      match:
        - {metric_field: name, exact: k8s.resource_quota.hard_limit}
        - {datapoint_attribute: [resource], exact: limits.ephemeral-storage}
      transform:
        remove: [{datapoint_attribute: [resource]}]
        rename: [{metric_field: name, to: k8s.resourcequota.ephemeral_storage.limit.hard}]

  - id: k8s-rq-used-ephemeral-storage-limit
    name: k8s.resource_quota.used{resource=limits.ephemeral-storage} becomes k8s.resourcequota.ephemeral_storage.limit.used
    metric:
      match:
        - {metric_field: name, exact: k8s.resource_quota.used}
        - {datapoint_attribute: [resource], exact: limits.ephemeral-storage}
      transform:
        remove: [{datapoint_attribute: [resource]}]
        rename: [{metric_field: name, to: k8s.resourcequota.ephemeral_storage.limit.used}]

  - id: k8s-rq-hard-ephemeral-storage-request
    name: k8s.resource_quota.hard_limit{resource=requests.ephemeral-storage} becomes k8s.resourcequota.ephemeral_storage.request.hard
    metric:
      match:
        - {metric_field: name, exact: k8s.resource_quota.hard_limit}
        - {datapoint_attribute: [resource], exact: requests.ephemeral-storage}
      transform:
        remove: [{datapoint_attribute: [resource]}]
        rename: [{metric_field: name, to: k8s.resourcequota.ephemeral_storage.request.hard}]

  - id: k8s-rq-used-ephemeral-storage-request
    name: k8s.resource_quota.used{resource=requests.ephemeral-storage} becomes k8s.resourcequota.ephemeral_storage.request.used
    metric:
      match:
        - {metric_field: name, exact: k8s.resource_quota.used}
        - {datapoint_attribute: [resource], exact: requests.ephemeral-storage}
      transform:
        remove: [{datapoint_attribute: [resource]}]
        rename: [{metric_field: name, to: k8s.resourcequota.ephemeral_storage.request.used}]

  - id: k8s-rq-hard-storage-request
    name: k8s.resource_quota.hard_limit{resource=requests.storage} becomes k8s.resourcequota.storage.request.hard
    description: Namespace-wide storage quota; semconv omits k8s.storageclass.name for it.
    metric:
      match:
