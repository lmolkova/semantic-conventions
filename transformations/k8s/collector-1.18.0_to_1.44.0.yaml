# K8s migration: pre-stability (Collector k8scluster / kubeletstats /
# k8sattributes) conventions -> semantic conventions v1.44.0.
#
# Source: docs/non-normative/k8s-migration.md ("Old (Collector)" column).
# The Collector receivers stamp sem_conv_version 1.18.0 on this data, so that
# is the source schema URL. Most "old" names never existed in any semconv
# release; see README.md for details.
#
# Only metrics and resource attributes change; there are no span or log
# changes in the guide.
#
# Changes intentionally left out (not bridgeable / not expressible):
#   - instrument changes gauge -> updowncounter (all metrics below; values
#     are the same point-in-time numbers, Prometheus exports both as gauges)
#   - same-name instrument changes: k8s.{node,pod}.filesystem.*,
#     container.filesystem.*, k8s.{pod,node}.memory.usage,
#     container.memory.usage, k8s.container.ready (nothing to rename)
#   - k8s.namespace.phase: same name, different meaning (value-encoded phase
#     -> per-phase attribute)
#   - k8s.node.condition_*, k8s.pod.phase, k8s.pod.status_reason: state is
#     encoded in the value; needs value -> attribute derivation
#   - *.memory.page_faults -> *.paging.faults{type=minor}: semconv defines
#     minor = PageFaults - MajorPageFaults, the old metric is the total
#   - k8s.pod.cpu_{limit,request}_utilization: denominator changed (sum of
#     container limits -> Pod-level limit); target metric is not in v1.44.0
#   - ResourceQuota / ClusterResourceQuota: CPU values (millicores -> cores),
#     bare `cpu`/`memory`/`ephemeral-storage` aliases, hugepages and
#     per-storage-class keys (need value maps / derived attributes)
#   - k8s.{pod,node,namespace}.{labels,annotations}.<key>: templated keys
#   - k8s.volume.{name,type}: resource attributes -> datapoint attributes
file_format: transform/2.0
source_schema_url: https://opentelemetry.io/schemas/1.18.0
target_schema_url: https://opentelemetry.io/schemas/1.44.0

policies:
  # --- Network metrics (kubeletstats): attribute renames, same metric name --
  - id: k8s-pod-network-io-attrs
    name: k8s.pod.network.io attributes interface/direction renamed
    description: >
      Target-safe: stable records carry network.interface.name /
      network.io.direction and never the bare `interface` / `direction` keys.
    metric:
      match: [{metric_field: name, exact: k8s.pod.network.io}]
      transform:
        rename:
          - {datapoint_attribute: [interface], to: network.interface.name}
          - {datapoint_attribute: [direction], to: network.io.direction}

  - id: k8s-pod-network-errors-attrs
    name: k8s.pod.network.errors attributes interface/direction renamed
    metric:
      match: [{metric_field: name, exact: k8s.pod.network.errors}]
      transform:
        rename:
          - {datapoint_attribute: [interface], to: network.interface.name}
          - {datapoint_attribute: [direction], to: network.io.direction}

  - id: k8s-node-network-io-attrs
    name: k8s.node.network.io attributes interface/direction renamed
    metric:
      match: [{metric_field: name, exact: k8s.node.network.io}]
      transform:
        rename:
          - {datapoint_attribute: [interface], to: network.interface.name}
          - {datapoint_attribute: [direction], to: network.io.direction}

  - id: k8s-node-network-errors-attrs
    name: k8s.node.network.errors attributes interface/direction renamed
    metric:
      match: [{metric_field: name, exact: k8s.node.network.errors}]
      transform:
        rename:
          - {datapoint_attribute: [interface], to: network.interface.name}
          - {datapoint_attribute: [direction], to: network.io.direction}

