# GenAI conventions at lmolkova/semantic-conventions-genai@1780533 (manifest
# schema_url gen-ai-dev/1.42.0-dev) -> GenAI v1.41.0. This lets dashboards
# written against v1.41 also see data from new producers.
#
# Guide: https://github.com/lmolkova/semantic-conventions-genai/blob/1780533536101fee409056c8ff24ed99ab861f0a/docs/gen-ai/non-normative/migration.md
#
# Written on its own, not by inverting 1.41.0_to_gen-ai-dev-1.42.0-dev.yaml. The
# target side follows the v1.41.0 model. The source side follows the model at
# the pinned commit (#521 isn't there; see the pre->stable file header).
#
# Left out:
#   - Keys removed from internal invoke_agent spans (agent.id, agent.version,
#     provider.name, cache token counts): source data doesn't have them. Cache
#     counts could be re-aggregated from child inference spans (needs a
#     cross-span aggregation op).
#   - gen_ai.output.messages[].finish_reason (deprecated, now optional): needs
#     a JSON-content derive from gen_ai.response.finish_reasons.
#   - gen_ai.client.inference.usage.* counters, invoke_agent / execute_tool /
#     invoke_workflow metrics, new attributes and operations: extra in source,
#     ignored.
#   - MCP server span status for client-side JSON-RPC errors (#389): needs a
#     span-status op. Only error.type is restored here.
file_format: transform/2.0
source_schema_url: https://opentelemetry.io/schemas/gen-ai-dev/1.42.0-dev
target_schema_url: https://opentelemetry.io/schemas/1.41.0

policies:
  # --- #440: cache_write -> cache_creation (spans and the details event) ------
  - id: genai-440-cache-creation-span
    name: gen_ai.usage.cache_write.input_tokens renamed back to gen_ai.usage.cache_creation.input_tokens on spans
    description: Target-safe because the v1.41 registry has no cache_write key.
    trace:
      match: [{span_attribute: [gen_ai.usage.cache_write.input_tokens], exists: true}]
      transform:
        rename: [{span_attribute: [gen_ai.usage.cache_write.input_tokens], to: gen_ai.usage.cache_creation.input_tokens}]

  - id: genai-440-cache-creation-event
    name: gen_ai.usage.cache_write.input_tokens renamed back on the gen_ai.client.inference.operation.details event
    log:
      match:
        - {log_field: event_name, exact: gen_ai.client.inference.operation.details}
        - {log_attribute: [gen_ai.usage.cache_write.input_tokens], exists: true}
      transform:
        rename: [{log_attribute: [gen_ai.usage.cache_write.input_tokens], to: gen_ai.usage.cache_creation.input_tokens}]

  # --- #217: int -> double; retrieval.top_k -> request.top_k ------------------
  - id: genai-217-request-top-k-double
    name: gen_ai.request.top_k is a double in v1.41
    description: >
      Target-safe: v1.41 values are already double. int -> double is exact.
      The source registry only defines gen_ai.request.top_k on inference
      spans, so no operation matcher is needed.
    trace:
      match: [{span_attribute: [gen_ai.request.top_k], exists: true}]
      transform:
        convert: [{span_attribute: [gen_ai.request.top_k], type: double}]

  - id: genai-217-retrieval-top-k
    name: gen_ai.retrieval.top_k becomes gen_ai.request.top_k (double)
    description: >
      Target-safe: v1.41 has no gen_ai.retrieval.top_k. A source span never
      carries both keys: request.top_k is decoding-only and retrieval.top_k is
      retrieval-only. Because rename defaults to upsert false, a hypothetical
      span with both keeps its request.top_k.
    trace:
      match: [{span_attribute: [gen_ai.retrieval.top_k], exists: true}]
      transform:
        convert: [{span_attribute: [gen_ai.retrieval.top_k], type: double}]
        rename: [{span_attribute: [gen_ai.retrieval.top_k], to: gen_ai.request.top_k}]

  # --- #374: per-direction histograms -> gen_ai.client.token.usage ------------
  - id: genai-374-input-tokens-back
    name: gen_ai.client.inference.operation.input_tokens becomes gen_ai.client.token.usage with token.type=input
    description: >
      Same instrument (histogram), unit ({token}) and attributes, plus
      gen_ai.token.type. Target-safe: matches a source-only metric name. The
      new gen_ai.client.inference.usage.* counters are extra in the source and
      ignored: renaming them too would double count the token.usage _sum.
      upsert true: the metric name alone decides the token type.
    metric:
      match: [{metric_field: name, exact: gen_ai.client.inference.operation.input_tokens}]
      transform:
        rename: [{metric_field: name, to: gen_ai.client.token.usage}]
        add: [{datapoint_attribute: [gen_ai.token.type], value: input, upsert: true}]

  - id: genai-374-output-tokens-back
    name: gen_ai.client.inference.operation.output_tokens becomes gen_ai.client.token.usage with token.type=output
    metric:
      match: [{metric_field: name, exact: gen_ai.client.inference.operation.output_tokens}]
      transform:
        rename: [{metric_field: name, to: gen_ai.client.token.usage}]
        add: [{datapoint_attribute: [gen_ai.token.type], value: output, upsert: true}]

  # --- #389 (not in the guide): restore error.type for client-side codes ------
  # Single-value emulation of "error.type := rpc.response.status_code": one
  # policy per code and signal. Target-safe: a v1.41 server record with one of
  # these codes already has error.type set to that code, and add keeps it
  # (upsert false). Span status stays unset; no op can set it.
  - id: mcp-389-server-32700-span
    name: MCP server spans with JSON-RPC -32700 get error.type
    trace:
      match:
        - {span_kind: server}
        - {span_attribute: [mcp.method.name], exists: true}
        - {span_attribute: [rpc.response.status_code], exact: "-32700"}
      transform:
        add: [{span_attribute: [error.type], value: "-32700"}]
  - id: mcp-389-server-32600-span
    name: MCP server spans with JSON-RPC -32600 get error.type
    trace:
      match:
        - {span_kind: server}
        - {span_attribute: [mcp.method.name], exists: true}
        - {span_attribute: [rpc.response.status_code], exact: "-32600"}
      transform:
        add: [{span_attribute: [error.type], value: "-32600"}]
  - id: mcp-389-server-32601-span
    name: MCP server spans with JSON-RPC -32601 get error.type
    trace:
      match:
        - {span_kind: server}
        - {span_attribute: [mcp.method.name], exists: true}
        - {span_attribute: [rpc.response.status_code], exact: "-32601"}
      transform:
        add: [{span_attribute: [error.type], value: "-32601"}]
  - id: mcp-389-server-32602-span
    name: MCP server spans with JSON-RPC -32602 get error.type
    trace:
      match:
        - {span_kind: server}
        - {span_attribute: [mcp.method.name], exists: true}
        - {span_attribute: [rpc.response.status_code], exact: "-32602"}
      transform:
        add: [{span_attribute: [error.type], value: "-32602"}]
  - id: mcp-389-server-32002-span
    name: MCP server spans with JSON-RPC -32002 get error.type
    trace:
      match:
        - {span_kind: server}
        - {span_attribute: [mcp.method.name], exists: true}
        - {span_attribute: [rpc.response.status_code], exact: "-32002"}
      transform:
        add: [{span_attribute: [error.type], value: "-32002"}]

  - id: mcp-389-server-32700-metric
    name: mcp.server.operation.duration with JSON-RPC -32700 gets error.type
    metric:
      match:
        - {metric_field: name, exact: mcp.server.operation.duration}
        - {datapoint_attribute: [rpc.response.status_code], exact: "-32700"}
      transform:
        add: [{datapoint_attribute: [error.type], value: "-32700"}]
  - id: mcp-389-server-32600-metric
    name: mcp.server.operation.duration with JSON-RPC -32600 gets error.type
    metric:
      match:
        - {metric_field: name, exact: mcp.server.operation.duration}
        - {datapoint_attribute: [rpc.response.status_code], exact: "-32600"}
      transform:
        add: [{datapoint_attribute: [error.type], value: "-32600"}]
  - id: mcp-389-server-32601-metric
    name: mcp.server.operation.duration with JSON-RPC -32601 gets error.type
    metric:
      match:
        - {metric_field: name, exact: mcp.server.operation.duration}
        - {datapoint_attribute: [rpc.response.status_code], exact: "-32601"}
      transform:
        add: [{datapoint_attribute: [error.type], value: "-32601"}]
  - id: mcp-389-server-32602-metric
    name: mcp.server.operation.duration with JSON-RPC -32602 gets error.type
    metric:
      match:
        - {metric_field: name, exact: mcp.server.operation.duration}
        - {datapoint_attribute: [rpc.response.status_code], exact: "-32602"}
      transform:
        add: [{datapoint_attribute: [error.type], value: "-32602"}]
  - id: mcp-389-server-32002-metric
    name: mcp.server.operation.duration with JSON-RPC -32002 gets error.type
    metric:
      match:
        - {metric_field: name, exact: mcp.server.operation.duration}
        - {datapoint_attribute: [rpc.response.status_code], exact: "-32002"}
      transform:
        add: [{datapoint_attribute: [error.type], value: "-32002"}]
