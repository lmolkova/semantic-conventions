text_maps:
  # Curated display titles for registry pages, keyed by the raw attribute
  # namespace or entity type. Used by the `map_or` macro (see attribute_macros.j2)
  # to override the default humanized/title-cased heading.
  namespace_mapping:
    aspnetcore: ASP.NET Core
    cicd: CI/CD
    cicd.pipeline: CI/CD Pipeline
    cicd.pipeline.run: CI/CD Pipeline Run
    cicd.worker: CI/CD Worker
    webengine: Web Engine
    zos: z/OS
    zos.software: z/OS Software
    jsonrpc: JSON-RPC
    dotnet: .NET
