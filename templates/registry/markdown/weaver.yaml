params:
  # Base URL of this registry's generated attribute/entity pages. Used to build
  # links to attribute documentation. Overridable via `--param`.
  registry_base_url: /docs/registry/
  # Documentation links (kept identical to the pre-v2 templates so generated
  # markdown does not change).
  otel_requirement_level_url: https://opentelemetry.io/docs/specs/semconv/general/attribute-requirement-level/
  naming_recommendations_url: ../../general/naming.md#recommendations-for-application-developers
  recording_errors_url: /docs/general/recording-errors.md

templates:
  # Attribute registry: one index page plus one page per root namespace.
  - template: attributes_readme.md.j2
    filter: &attributes_filter >-
      semconv_grouped_attributes({
        "v2": true,
        "exclude_deprecated": false,
        "ignore_code_generation_annotations": true
      })
    application_mode: single
    file_name: attributes/README.md
  - template: attribute_namespace.md.j2
    filter: *attributes_filter
    application_mode: each
    file_name: "attributes/{{ ctx.root_namespace | lower | kebab_case }}.md"

  - template: registry_readme.md.j2
    filter: "."
    application_mode: single
    file_name: README.md

  # Entity registry: one index page plus one page per root namespace.
  - template: entity_readme.md.j2
    filter: &entities_filter >-
      semconv_signal("entity"; {
        "v2": true,
        "exclude_deprecated": false
      })
      | group_by(.root_namespace)
      | map({ root_namespace: .[0].root_namespace, entities: . | sort_by(.type) })
    application_mode: single
    file_name: "entities/README.md"
  - template: entity_namespace.md.j2
    filter: *entities_filter
    application_mode: each
    file_name: "entities/{{ ctx.root_namespace | kebab_case }}.md"

